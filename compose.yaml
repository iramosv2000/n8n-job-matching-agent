# Local platform: PostgreSQL, schema migrations, matcher-service and n8n on a private network.
# Secrets come from .env (create it with scripts/init_env.sh).
# Ollama runs natively on the host (ADR-0007); n8n reaches it at http://host.docker.internal:11434.

name: job-matcher

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # n8n 2.x supports PostgreSQL 17+; 18 is the newest major (ADR-0002).
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobmatcher}
      POSTGRES_USER: ${POSTGRES_USER:-jobmatcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set; run scripts/init_env.sh}
    volumes:
      # PostgreSQL 18 images keep data in a versioned subdirectory of /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]
    logging: *default-logging

  migrate:
    # One-shot: applies db/migrations/*.sql to schema "jobs" (dbmate), then exits.
    image: ghcr.io/amacneil/dbmate:2.36.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-jobmatcher}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set; run scripts/init_env.sh}@postgres:5432/${POSTGRES_DB:-jobmatcher}?sslmode=disable&search_path=jobs
    command: ["--migrations-dir", "/db/migrations", "--no-dump-schema", "--wait", "up"]
    volumes:
      - ./db/migrations:/db/migrations:ro
    restart: "no"
    networks: [internal]
    logging: *default-logging

  matcher:
    build: ./services/matcher
    image: job-matcher/matcher:0.1.0
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    networks: [internal]
    logging: *default-logging

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      matcher:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-jobmatcher}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-jobmatcher}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set; run scripts/init_env.sh}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is not set; run scripts/init_env.sh}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: America/Santiago
      TZ: America/Santiago
      # Privacy: no telemetry, no update pings, no onboarding survey.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Env access stays blocked in expressions (n8n default) so workflows cannot read
      # DB_POSTGRESDB_PASSWORD or N8N_ENCRYPTION_KEY. Workflows call matcher-service at the
      # fixed internal address http://matcher:8000.
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz/readiness >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks: [internal]
    logging: *default-logging

networks:
  internal:

volumes:
  postgres_data:
  n8n_data:
