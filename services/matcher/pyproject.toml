[project]
name = "matcher"
version = "0.1.0"
description = "Deterministic domain logic for the n8n job-matching agent: normalisation, deduplication, scoring and guardrails."
authors = [{ name = "Ignacio Ramos Valenzuela" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.3",
    "httpx2>=2.13.1",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from src/ directly: on macOS, uv marks .venv hidden and Python skips hidden .pth files,
# which breaks the editable install for tests.
pythonpath = ["src"]
addopts = "-q --cov=matcher --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT"]
